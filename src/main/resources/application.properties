spring.application.name=DoorDrop

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/doordrop_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjcmV0IGtleSBmb3IgZG9vcmRyb3AgYXBwbGljYXRpb24gand0
jwt.expiration=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Razorpay ──────────────────────────────────────────────────────────────────
razorpay.key.id=rzp_test_REPLACE_WITH_YOUR_KEY_ID
razorpay.key.secret=REPLACE_WITH_YOUR_KEY_SECRET
razorpay.webhook.secret=REPLACE_WITH_YOUR_WEBHOOK_SECRET

# ── Google Maps ───────────────────────────────────────────────────────────────
google.maps.api.key=REPLACE_WITH_YOUR_GOOGLE_MAPS_API_KEY

# ── Delivery assignment ───────────────────────────────────────────────────────
# Max radius (km) to search for available delivery agents
delivery.agent.search.radius.km=15
